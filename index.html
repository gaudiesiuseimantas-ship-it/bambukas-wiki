<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bambukas.lt — Žinynas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#06180e;--panel:#102519;--line:#31513b;--green:#98ff64;--text:#e8f5e8;--muted:#a6bdae}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#173b23,#06180e 60%);color:var(--text);font:14px Inter,Arial,sans-serif;min-height:100vh}header{background:#06180de8;border-bottom:1px solid #1b3a25;position:sticky;top:0;z-index:3}.top{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 20px}.brand{font-weight:900;font-size:21px;color:#fff;text-decoration:none;text-shadow:2px 3px #000}.brand span{color:var(--green)}.top nav{display:flex;gap:23px}.top nav a{color:#e2eee3;text-decoration:none;font-weight:700;font-size:13px}.ip{border:1px solid var(--green);background:#193c21;color:var(--green);border-radius:6px;padding:12px;cursor:pointer;font-weight:800}.wrap{max-width:1100px;margin:78px auto;padding:0 20px}.eyebrow{color:var(--green);font-weight:800;letter-spacing:2px;font-size:11px}.intro h1{font-size:38px;margin:15px 0}.intro p{color:var(--muted)}.columns{display:grid;grid-template-columns:220px minmax(0,1fr) 175px;gap:16px;margin-top:32px;align-items:start}.panel{background:#102519ed;border:1px solid var(--line);border-radius:12px;padding:17px}.side{position:sticky;top:86px}.side input{width:100%;padding:12px;background:#091a10;color:white;border:1px solid #3c6146;border-radius:6px;outline:none}.group{font-size:10px;font-weight:800;color:#ffc85c;letter-spacing:1px;margin:20px 0 10px}.navbtn{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:#c7d8c9;font-weight:700;font-size:12px;padding:11px 10px;cursor:pointer;border-radius:4px}.navbtn:hover,.navbtn.active{background:#1c4029;color:var(--green);border-left-color:var(--green)}article{min-height:450px;padding:38px}article .crumb{font-size:11px;color:var(--green);font-weight:800;letter-spacing:1px}article h2{font-family:'Press Start 2P',monospace;font-size:25px;line-height:1.6;overflow-wrap:anywhere;margin:22px 0}article h3{font-size:20px;margin:28px 0 12px}article p,article li{color:#c7d9c9;line-height:1.9}article hr{border:0;border-top:1px solid var(--line);margin:23px 0}.callout{background:#1c402a;border-left:3px solid var(--green);padding:17px;border-radius:5px;margin:20px 0;color:#d9ecdb;line-height:1.7}.command{display:inline-block;background:#1a3d25;color:var(--green);border-radius:4px;padding:3px 7px;font-family:monospace}.next{background:var(--green);color:#0b240e;padding:13px;border:0;border-radius:6px;font-weight:800;cursor:pointer;margin-top:18px}.right strong{font-size:11px;color:#ffc85c;letter-spacing:1px}.right a{display:block;color:#c9ddcc;text-decoration:none;margin-top:18px;font-size:12px}.foot{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;color:#9eb7a1;font-size:12px}@media(max-width:850px){.columns{grid-template-columns:190px 1fr}.right{display:none}.wrap{margin-top:40px}}@media(max-width:600px){.top nav{display:none}.ip{font-size:10px}.columns{display:block}.side{position:static;margin-bottom:14px}.side .links{display:grid;grid-template-columns:1fr 1fr}.group{grid-column:1/-1}article{padding:20px;min-height:300px}article h2{font-size:18px}.intro h1{font-size:29px}.wrap{padding:0 12px}}</style></head><body><header><div class="top"><a class="brand" href="#pradzia">play.<span>bambukas</span>.net</a><nav><a href="#pradzia">Pradžia</a><a href="#prisijungimas">Informacija</a><a href="#administracija">Bendruomenė</a></nav><button class="ip" id="copy">⧉ play.bambukas.net</button></div></header><div class="wrap"><div class="intro"><div class="eyebrow">BAMBUKAS.LT • ŽINIŲ BAZĖ</div><h1>Nuotykių žinynas ✦</h1><p>Visi atsakymai vienoje vietoje. Pasirink temą kairėje ir sužinok daugiau apie mūsų Minecraft pasaulį.</p></div><div class="columns"><aside class="panel side"><input id="search" placeholder="⌕ Ieškoti informacijos..." aria-label="Paieška"><div class="links" id="nav"></div></aside><article class="panel" id="article"></article><aside class="panel right"><strong>ŠIAME PUSLAPYJE</strong><div id="toc"></div></aside></div></div><script>
const pages=[['pradzia','PRADŽIA','Naujoko gidas','Sveiki atvykę į Bambukas.lt!','Čia rasi svarbiausią informaciją, kuri padės pradėti žaidimą.'],['prisijungimas','PRADŽIA','Kaip prisijungti','Prisijungimas prie serverio','Atidaryk Minecraft, pasirink Multiplayer, tada Add Server ir įvesk adresą play.bambukas.net.'],['komandos','PRADŽIA','Serverio komandos','Serverio komandos','Naudingų komandų pavyzdžiai.'],['rezidencijos','ŽAIDIMAS','Rezidencijos','Rezidencijos','Sužinok, kaip veikia teritorijų apsauga.'],['ekonomika','ŽAIDIMAS','Ekonomika','Ekonomika','Informacija apie serverio ekonomiką ir prekybą.'],['pozemiai','ŽAIDIMAS','Požemiai','Požemiai','Požemių ir nuotykių gidas.'],['taskai','ŽAIDIMAS','Taškai','Taškų sistema','Informacija apie serverio taškus.'],['zvejyba','ŽAIDIMAS','Žvejyba','Žvejyba','Žvejybos gidas.'],['administracija','BENDRUOMENĖ','Administracija','Administracija','Čia bus pateikta projekto komanda.'],['taisykles','BENDRUOMENĖ','Serverio taisyklės','Serverio taisyklės','Susipažink su serverio taisyklėmis.'],['atrankos','BENDRUOMENĖ','Atrankos į komandą','Atrankos į komandą','Informacija apie atrankas.']];
const extra={komandos:'<h3 id="naudinga">Naudingos komandos</h3><p><span class="command">/spawn</span> – grįžti į pradinę vietą.</p><p><span class="command">/msg</span> – siųsti privačią žinutę.</p><p><span class="command">/help</span> – pagalbos informacija.</p><h3 id="svarbu">Svarbu</h3><div class="callout">Tai tik pavyzdžiai. Dar nepatvirtinta, kurios komandos veikia Bambukas.lt serveryje.</div>',taisykles:'<h3 id="bendros">Bendrosios taisyklės</h3><p>Gerbk kitus žaidėjus ir laikykis sąžiningo žaidimo principų.</p><h3 id="pastaba">Svarbu</h3><div class="callout">Šis tekstas yra pavyzdinis. Prieš paskelbiant būtina įrašyti oficialias serverio taisykles.</div>',prisijungimas:'<h3 id="adresas">Serverio adresas</h3><div class="callout"><b>play.bambukas.net</b></div><p>Serverio versiją ir prisijungimo reikalavimus papildysime vėliau.</p>'};
const nav=document.getElementById('nav'),article=document.getElementById('article'),toc=document.getElementById('toc');function drawNav(q=''){let group='';nav.innerHTML='';for(const p of pages){if(q&&!p.slice(2).join(' ').toLowerCase().includes(q.toLowerCase()))continue;if(p[1]!==group){group=p[1];const t=document.createElement('div');t.className='group';t.textContent=group;nav.appendChild(t)}const b=document.createElement('button');b.className='navbtn';b.textContent=p[2];b.dataset.id=p[0];b.onclick=()=>location.hash=p[0];nav.appendChild(b)}highlight()};function highlight(){const id=location.hash.slice(1)||'pradzia';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id))};function render(){const id=location.hash.slice(1)||'pradzia';const index=Math.max(0,pages.findIndex(p=>p[0]===id));const p=pages[index];article.innerHTML=`<div class="crumb">PRADŽIA / ${p[2].toUpperCase()}</div><h2>${p[3]}</h2><hr><h3 id="apie">${p[2]}</h3><p>${p[4]}</p>${extra[id]||'<div class="callout">Šį skyrių papildysime tikra Bambukas.lt serverio informacija.</div>'}<div class="foot">🌿 Bambukas.lt žinynas</div><button class="next" id="next">Kita tema → ${pages[(index+1)%pages.length][2]}</button>`;document.getElementById('next').onclick=()=>location.hash=pages[(index+1)%pages.length][0];toc.innerHTML='';article.querySelectorAll('h3[id]').forEach(h=>{const a=document.createElement('a');a.href='#'+id;a.textContent=h.textContent;a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth',block:'center'})};toc.appendChild(a)});highlight()};document.getElementById('search').addEventListener('input',e=>drawNav(e.target.value));document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText('play.bambukas.net');document.getElementById('copy').textContent='✓ IP nukopijuotas';setTimeout(()=>document.getElementById('copy').textContent='⧉ play.bambukas.net',1800)}catch(e){prompt('Nukopijuok serverio IP:','play.bambukas.net')}};window.addEventListener('hashchange',render);drawNav();render();
</script></body></html>
