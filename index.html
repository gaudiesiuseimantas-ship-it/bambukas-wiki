<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bambukas.lt Wiki</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet"><style>

color:var(--green);border-left:3px solid var(--green)}.article{min-height:590px;padding:35px 38px}.article h2{font-family:'Press Start 2P',monospace;font-size:clamp(17px,2.2vw,25px);line-height:1.65;letter-spacing:0;margin:6px 0 23px}.article h3{font-size:21px;margin:28px 0 8px}.article p,.article li{color:#c8d9cb}.rule{border-top:1px solid var(--line);padding:16px 0}.rule strong{color:#f3fff0}.crumb{color:var(--green);font-size:10px;letter-spacing:1.5px;font-weight:900;margin-bottom:14px}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.toc{padding:17px;position:sticky;top:92px}.toc h4{color:var(--gold);font-size:10px;letter-spacing:1px;margin:0 0 12px}.toc a{display:block;color:#c6d7c8;text-decoration:none;font-size:11px;margin:10px 0}.toc a:hover{color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px}.card{background:#173321;border:1px solid #355941;border-radius:9px;overflow:hidden;text-align:left;color:white;padding:0;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:var(--green)}.card-art{height:105px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#295d34,#102819);position:relative}.card-art:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 13px,#ffffff05 13px 14px)}.card strong{display:block;padding:14px;font-size:12px;line-height:1.5}.notice{border-left:3px solid var(--green);background:#1c412b;padding:14px 16px;border-radius:5px;color:#d4e5d4;margin:20px 0}.command{background:#1b3d29;color:var(--green);border-radius:5px;padding:4px 7px;font-family:monospace}.footer{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:20px;margin-top:35px;color:#91a996;font-size:11px}.next{background:var(--green);color:#0a1c0d;border:0;border-radius:6px;font-weight:900;padding:10px 12px}.hidden{display:none}.empty{color:#c5d3c6;font-size:12px}.mobile-toggle{display:none}@media(max-width:950px){.layout{grid-template-columns:215px minmax(0,1fr)}.toc{display:none}.toplinks{display:none}}@media(max-width:650px){.top-inner{min-height:62px}.brand{font-size:10px}.server{font-size:10px;padding:8px}.intro{padding:32px 16px 20px}.intro h1{font-size:27px}.layout{display:block;padding:0 12px}.sidebar{position:static;margin-bottom:12px}.article{padding:23px 18px;min-height:400px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card-art{height:85px}.footer{flex-wrap:wrap}.navgroups{display:none}.navgroups.open{display:block}.mobile-toggle{display:block;background:#193b27;border:1px solid var(--line);color:white;padding:8px 12px;border-radius:5px;margin-top:10px;width:100%;text-align:left}}
</style></head><body><header class="top"><div class="top-inner"><a class="brand" href="#pradzia">play.<b>bambukas</b>.net</a><nav class="toplinks"><a href="#pradzia">Pradžia</a><a href="#informacija">Informacija</a><a href="#administracija">Bendruomenė</a></nav><button class="server" id="copyip" title="Kopijuoti serverio adresą">⧉ play.bambukas.net</button></div></header><section class="intro"><div class="eyebrow">BAMBUKAS.LT • ŽINIŲ BAZĖ</div><h1>Nuotykių žinynas <span style="color:var(--green)">✦</span></h1><p>Oficiali Bambukas.lt Minecraft projekto Wiki. Viskas, ką reikia žinoti, vienoje vietoje.</p></section><div class="layout"><aside class="sidebar"><input id="search" class="search" placeholder="⌕ Ieškoti informacijos..." aria-label="Ieškoti Wiki"><button class="mobile-toggle" id="toggle">☰ Rodyti kategorijas</button><div class="navgroups" id="nav"></div></aside><main class="article" id="article" tabindex="-1"></main><aside class="toc"><h4>ŠIAME PUSLAPYJE</h4><div id="toc"></div></aside></div><script>
const groups={'NARŠYMAS':[['pradzia','Pagrindinis puslapis']],'INFORMACIJA':[['taisykles','Serverio taisyklės'],['informacija','Serverio informacija'],['administracija','Administracija'],['nuorodos','Nuorodos']],'GIDAI':[['naujokas','Naujoko gidas'],['prisijungimas','Kaip prisijungti'],['komandos','Serverio komandos'],['rezidencijos','Rezidencijos'],['ekonomika','Ekonomika']],'BENDRUOMENĖ':[['atrankos','Atrankos į komandą']]};
const pages={
pradzia:{title:'Sveiki atvykę į Bambukas.lt Wiki!',sections:[['Oficialus Bambukas.lt Wiki puslapis',`<p>Sveiki atvykę į <b>Bambukas.lt</b> projekto žinių bazę! Čia rasi serverio taisykles, informaciją, naujokų gidus ir kitus naudingus straipsnius.</p><p>Pasirink dominančią temą žemiau arba naudok paiešką kairėje.</p><div class="cards">${[['🛡️','Serverio taisyklės','taisykles'],['🏡','Serverio informacija','informacija'],['👑','Administracija','administracija'],['🗺️','Nuorodos','nuorodos'],['🧭','Naujoko gidas','naujokas'],['⌨️','Serverio komandos','komandos']].map(([e,t,id])=>`<button class="card" data-page="${id}"><div class="card-art">${e}</div><strong>${t} →</strong></button>`).join('')}</div>`]]},
taisykles:{title:'Serverio taisyklės',sections:[['Bendrosios taisyklės','<p>Šiame puslapyje bus pateiktos oficialios Bambukas.lt serverio taisyklės.</p><div class="notice">Svarbu: taisyklių tekstas dar nepatvirtintas. Žemiau pateikti tik pavyzdžiai.</div>'],['Pavyzdinės taisyklės','<div class="rule"><strong>01. Pagarba</strong><p>Gerbk kitus žaidėjus ir bendruomenės narius.</p></div><div class="rule"><strong>02. Sąžiningas žaidimas</strong><p>Nenaudok nesąžiningą pranašumą suteikiančių priemonių.</p></div><div class="rule"><strong>03. Reklama</strong><p>Kitų projektų reklama be leidimo gali būti ribojama.</p></div>']]},
informacija:{title:'Serverio informacija',sections:[['Apie projektą','<p>Bambukas.lt – Minecraft projektas. Šiame puslapyje bus galima sužinoti apie serverio žaidimo režimus ir funkcijas.</p>'],['Prisijungimo adresas','<p><span class="command">play.bambukas.net</span></p>'],['Serverio versija','<div class="notice">Versija ir palaikomi žaidimo leidimai dar nepatvirtinti.</div>']]},
administracija:{title:'Administracija',sections:[['Projekto komanda','<p>Čia bus pateikti Bambukas.lt administracijos nariai, jų pareigos ir kontaktai.</p>'],['Susisiekimas','<p>Administracijos kontaktus pridėsime, kai jie bus patvirtinti.</p>']]},
nuorodos:{title:'Naudingos nuorodos',sections:[['Serverio adresas','<p><span class="command">play.bambukas.net</span></p>'],['Bendruomenės nuorodos','<p>Discord ir kitų oficialių kanalų nuorodas pridėsime gavę patvirtintus adresus.</p>']]},
naujokas:{title:'Naujoko gidas',sections:[['Pirmieji žingsniai','<p>Sveikas atvykęs į Bambukas.lt! Šis gidas padės pasiruošti pirmiesiems nuotykiams.</p><ol><li>Atidaryk Minecraft ir prisijunk prie serverio.</li><li>Perskaityk serverio taisykles.</li><li>Susipažink su žaidimo sistemomis ir bendruomene.</li></ol>'],['Ką verta žinoti?','<p>Susipažink su rezidencijų, ekonomikos ir komandų skiltimis.</p><div class="notice">Tai bendras naujoko gidas. Tikros serverio funkcijos dar tikslinamos.</div>']]},
prisijungimas:{title:'Kaip prisijungti',sections:[['Prisijungimo instrukcija','<ol><li>Paleisk Minecraft.</li><li>Atidaryk kelių žaidėjų režimą (Multiplayer).</li><li>Pridėk serverį adresu <span class="command">play.bambukas.net</span>.</li><li>Prisijunk ir pradėk žaisti.</li></ol>'],['Svarbu','<p>Prieš jungiantis patikrink, kokią Minecraft versiją palaiko serveris.</p>']]},
komandos:{title:'Serverio komandos',sections:[['Naudingos komandos','<p>Žemiau pateikiami Minecraft serveriuose dažnai sutinkamų komandų <b>pavyzdžiai</b>.</p><div class="rule"><span class="command">/spawn</span> – grįžti į pradinę vietą.</div><div class="rule"><span class="command">/msg</span> – parašyti privačią žinutę.</div><div class="rule"><span class="command">/help</span> – peržiūrėti pagalbą.</div>'],['Svarbu','<div class="notice">Šios komandos dar nepatvirtintos Bambukas.lt serveryje.</div>']]},
rezidencijos:{title:'Rezidencijos',sections:[['Teritorijos apsauga','<p>Šioje skiltyje bus paaiškinta, kaip Bambukas.lt serveryje veikia rezidencijos ir teritorijų apsauga.</p>'],['Komandos ir leidimai','<div class="notice">Laukiama patvirtintos serverio rezidencijų sistemos informacijos.</div>']]},
ekonomika:{title:'Ekonomika',sections:[['Serverio ekonomika','<p>Čia bus informacija apie serverio valiutą, prekybą ir ekonomiką.</p>'],['Prekyba','<div class="notice">Tikslios ekonomikos funkcijos dar nepatvirtintos.</div>']]},
atrankos:{title:'Atrankos į komandą',sections:[['Prisijunk prie komandos','<p>Čia bus skelbiama informacija apie atrankas į Bambukas.lt projekto komandą.</p>'],['Reikalavimai','<div class="notice">Atrankų datos ir reikalavimai dar nepaskelbti.</div>']]}}
const nav=document.getElementById('nav'),article=document.getElementById('article'),toc=document.getElementById('toc'),search=document.getElementById('search');let current='pradzia';function renderNav(q=''){let out='';for(const [g,items] of Object.entries(groups)){let filtered=items.filter(([id,name])=>name.toLowerCase().includes(q));if(filtered.length)out+=`<div class="navhead">${g}</div>`+filtered.map(([id,name])=>`<button class="navitem ${id===current?'active':''}" data-page="${id}">${name}</button>`).join('')}nav.innerHTML=out||'<p class="empty">Nieko nerasta.</p>'}function openPage(id){if(!pages[id])id='pradzia';current=id;const p=pages[id];article.innerHTML=`<div class="crumb">BAMBUKAS.LT / ${id==='pradzia'?'PRADŽIA':'WIKI'}</div><h2>${p.title}</h2><hr class="divider">`+p.sections.map(([title,body],i)=>`<section id="s${i}"><h3>${title}</h3>${body}</section>`).join('')+`<div class="footer"><span>🎋 Bambukas.lt žinynas</span><button class="next" id="backhome">← Pagrindinis puslapis</button></div>`;toc.innerHTML=p.sections.map(([t],i)=>`<a href="#s${i}">${t}</a>`).join('');document.getElementById('backhome').onclick=()=>location.hash='pradzia';renderNav(search.value.toLowerCase());if(innerWidth<650)document.querySelector('.navgroups').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)location.hash=b.dataset.page});window.addEventListener('hashchange',()=>openPage(decodeURIComponent(location.hash.slice(1))));search.addEventListener('input',()=>renderNav(search.value.toLowerCase()));document.getElementById('toggle').onclick=()=>nav.classList.toggle('open');document.getElementById('copyip').onclick=async()=>{try{await navigator.clipboard.writeText('play.bambukas.net');document.getElementById('copyip').textContent='✓ Nukopijuota!';setTimeout(()=>document.getElementById('copyip').textContent='⧉ play.bambukas.net',1800)}catch{prompt('Nukopijuok serverio adresą:','play.bambukas.net')}};openPage(decodeURIComponent(location.hash.slice(1)));
</script></body></html>
